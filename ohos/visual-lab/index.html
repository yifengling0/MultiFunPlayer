<!doctype html><meta charset="utf-8"><title>MFP shared production logic lab</title>
<style>*{box-sizing:border-box}body{margin:0;background:#11151e;color:#edf2fa;font:14px system-ui}button,select{font:inherit;border:1px solid #42546e;background:#23334c;color:white;border-radius:6px;padding:9px;cursor:pointer}header{padding:10px;display:flex;gap:10px;align-items:center;background:#202a3a}#stage{position:relative;margin:12px;border:1px solid #556b85;background:#182130;overflow:hidden}#bar{height:60px;padding:12px;background:#23334c}#settings{position:absolute;padding:12px;background:#273347;overflow:auto}#video{position:absolute;background:black;display:flex;flex-direction:column;box-shadow:0 0 0 2px #7795c0}#picture{position:relative;min-height:0;flex:1}video{height:100%;width:100%;object-fit:contain;pointer-events:none}#input{position:absolute;inset:0;touch-action:none;cursor:move}#controls{height:88px;flex-shrink:0;background:#111c2b;padding:6px}#buttons{display:flex;gap:6px;height:40px}#buttons button{flex:1;min-width:0}#heat{display:block;width:100%;height:36px;cursor:crosshair}#axes{display:flex;gap:8px;font-size:11px}#settings .spacer{height:950px;background:repeating-linear-gradient(#273347 0px,#273347 60px,#2c3c53 61px,#2c3c53 62px)}#status{font-family:monospace;white-space:pre-wrap;padding:10px}aside{padding:0 12px;color:#bbcbe2}#source{font-size:11px}</style>
<header><b>MFP 实际逻辑可视调试</b><select id="size"><option value="400,760">手机 400×760</option><option value="1100,700">平板 1100×700</option><option value="568,320">横屏 568×320</option></select><button id="floating">切换浮窗</button><button id="workspace">返回工作区</button><button id="full">全屏</button><label><input id="busy" type="checkbox">启动受阻</label></header>
<aside>复用生产 VideoLayout.ts + VideoInteraction.ts + Heatmap.ts。浏览器视频适配；不证明 ArkUI Surface、系统栏或 AVPlayer 真机行为。</aside>
<div id="stage"><div id="bar">MultiFunPlayer · 工作区 / 播放器</div><div id="settings"><h3>工作区占位（非生产控件）</h3><p>向下滚动超过96px触发浮窗。展开会回到大预览并滚动到顶部。</p><div class="spacer">合成滚动内容；非生产参数控件</div></div><div id="video"><div id="picture"><video id="media" muted playsinline src="sample.webm"></video><div id="input" aria-label="视频点击和拖动输入层"></div></div><div id="controls"><div id="buttons"><button id="play">播放</button><button id="expand">展开</button></div><canvas id="heat" aria-label="生产热图算法；点击定位视频"></canvas><div id="axes"><label><input type="radio" name="axis" value="0" checked>L0</label><label><input type="radio" name="axis" value="1">R0</label><label><input id="combine" type="checkbox" checked>合并双轴</label></div></div></div></div><div id="status"></div><aside id="source"></aside><script type="module" src="app.js"></script>
