name: OHOS core tests
on:
  push:
    branches: [feature/ohos-port]
    paths: ['ohos/**', '.github/workflows/ohos-core.yml']
  pull_request:
    paths: ['ohos/**', '.github/workflows/ohos-core.yml']
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pure core tests (not an OHOS SDK build)
        run: node --test tests/*.test.mjs
        working-directory: ohos
